# Active Alerts Dashboard Card - Standalone Example
# ─────────────────────────────────────────────────────────────────────────────
# Prerequisites:
#   - custom:auto-entities (HACS)
#   - custom:button-card (HACS)
#
# Features:
#   - Expands binary_sensor.automated_alert_sensors group
#   - Filters to active (on) alerts only
#   - Severity-based colour coding using effective severity (not_home_severity when away)
#   - Shows alert title and message
#   - Shows current status (notified/skipped/acknowledged/suppressed/actioned) top-right
#   - Tap to mark Done (turns off trigger_entity - intended for action severity)
#   - Hold to Acknowledge (calls script.alert_clear with acknowledged: true)
#
# Note: Tap-to-done fires for all severities in this example.
# A production implementation with custom button-card templates can restrict
# by severity and show/hide buttons based on status.
# ─────────────────────────────────────────────────────────────────────────────

type: custom:auto-entities
card:
  type: grid
  title: Active Alerts
  columns: 1
  square: false
card_param: cards
filter:
  include:
    - group: binary_sensor.automated_alert_sensors
      state: "on"
      options:
        type: custom:button-card
        entity: this.entity_id
        name: "[[[ return entity.attributes.title ]]]"
        show_name: true
        show_state: false
        label: "[[[ return entity.attributes.message ]]]"
        show_label: true
        layout: icon_name
        custom_fields:
          status: >-
            [[[  var helper = entity.attributes.status_helper; if (!helper ||
            helper === '') return 'Notified'; var s = states[helper] ?
            states[helper].state : ''; return ['idle', 'notified',
            'acknowledged', 'skipped', 'suppressed', 'actioned'].includes(s) ? s.charAt(0).toUpperCase() + s.slice(1) :
            'Notified'; ]]]
        styles:
          card:
            - border-radius: 12px
            - padding: 12px 16px
            - margin: 4px 0
            - box-shadow: none
          grid:
            - grid-template-areas: "'i n status' 'i l status'"
            - grid-template-columns: 48px 1fr auto
            - grid-template-rows: auto auto
          icon:
            - width: 32px
            - height: 32px
          name:
            - font-weight: "600"
            - font-size: 14px
            - text-align: left
            - justify-self: start
            - align-self: end
          label:
            - font-size: 12px
            - text-align: left
            - color: "#757575"
            - justify-self: start
            - align-self: start
          custom_fields:
            status:
              - font-size: 11px
              - text-transform: uppercase
              - letter-spacing: "0.5px"
              - color: "#9E9E9E"
              - justify-self: end
              - align-self: start
              - padding-left: 8px
              - white-space: nowrap
        state:
          - value: "on"
            styles:
              card:
                - background: |
                    [[[
                      var notHomeSev = entity.attributes.not_home_severity;
                      var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true;
                      var sev = (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity;
                      if (sev === 'critical') return '#F3E5F5';
                      if (sev === 'security') return '#E8EAF6';
                      if (sev === 'major') return '#FFF3E0';
                      if (sev === 'action') return '#FFFDE7';
                      if (sev === 'minor') return '#FFF8E1';
                      return '#F1F8E9';
                    ]]]
                - border-left: |
                    [[[
                      var notHomeSev = entity.attributes.not_home_severity;
                      var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true;
                      var sev = (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity;
                      if (sev === 'critical') return '4px solid #6A1B9A';
                      if (sev === 'security') return '4px solid #1A237E';
                      if (sev === 'major') return '4px solid #E65100';
                      if (sev === 'action') return '4px solid #F9A825';
                      if (sev === 'minor') return '4px solid #F9A825';
                      return '4px solid #558B2F';
                    ]]]
              icon:
                - color: |
                    [[[
                      var notHomeSev = entity.attributes.not_home_severity;
                      var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true;
                      var sev = (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity;
                      if (sev === 'critical') return '#6A1B9A';
                      if (sev === 'security') return '#1A237E';
                      if (sev === 'major') return '#E65100';
                      if (sev === 'action') return '#F9A825';
                      if (sev === 'minor') return '#F9A825';
                      return '#558B2F';
                    ]]]
              name:
                - color: |
                    [[[
                      var notHomeSev = entity.attributes.not_home_severity;
                      var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true;
                      var sev = (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity;
                      if (sev === 'critical') return '#4A148C';
                      if (sev === 'security') return '#0D1B8E';
                      if (sev === 'major') return '#BF360C';
                      if (sev === 'action') return '#F57F17';
                      if (sev === 'minor') return '#F57F17';
                      return '#33691E';
                    ]]]
              label:
                - color: |
                    [[[
                      var notHomeSev = entity.attributes.not_home_severity;
                      var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true;
                      var sev = (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity;
                      if (sev === 'critical') return '#4A148C';
                      if (sev === 'security') return '#0D1B8E';
                      if (sev === 'major') return '#BF360C';
                      if (sev === 'action') return '#F57F17';
                      if (sev === 'minor') return '#F57F17';
                      return '#33691E';
                    ]]]
        tap_action:
          action: call-service
          service: input_boolean.turn_off
          service_data:
            entity_id: "[[[ return entity.attributes.trigger_entity ]]]"
        hold_action:
          action: call-service
          service: script.alert_clear
          service_data:
            tag: "[[[ return entity.attributes.tag ]]]"
            acknowledged: true
            severity: "[[[ var notHomeSev = entity.attributes.not_home_severity; var isHome = states['binary_sensor.automated_alert_home'] ? states['binary_sensor.automated_alert_home'].state === 'on' : true; return (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : entity.attributes.severity; ]]]"
            status_helper: "[[[ return entity.attributes.status_helper ]]]"

# ─────────────────────────────────────────────────────────────────────────────
# Action Severity - Done Button Example
# ─────────────────────────────────────────────────────────────────────────────
# For action severity alerts, add a "Done" button that turns off the trigger
# entity (input_boolean). This marks the task as complete.
# Add this to the button-card options alongside the tap_action above,
# using hold_action or a custom_fields button per your preference.
#
# Example using hold_action for Done (tap = acknowledge, hold = done):
#
#        hold_action:
#          action: call-service
#          service: input_boolean.turn_off
#          service_data:
#            entity_id: "[[[ return entity.attributes.trigger_entity ]]]"
#
# Note: Only works for action severity alerts where trigger_entity is an
# input_boolean. For other trigger entity types adjust the service call.
# ─────────────────────────────────────────────────────────────────────────────