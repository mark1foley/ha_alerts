###############################################################################
# alert_notify_groups.yaml
#
# Notification audience groups for the alert framework.
# Referenced by script.alert_notify and script.alert_clear.
# No device references appear anywhere else in the framework.
#
# To add a new device, add it to the appropriate group(s) below.
# Changes require a full HA restart (notify platform cannot be reloaded).
#
# Audience structure:
#   minor_audience    — minor alerts
#   action_audience   — action alerts
#   major_audience    — major alerts
#   security_audience — security alerts
#   critical_audience — critical alerts
# Each group is independent: list every device that should receive that
# severity. Replace mobile_app_mafone with your own notify service name,
# WITHOUT the 'notify.' prefix (notify.mobile_app_x is rejected as an invalid slug).
###############################################################################

- platform: group
  name: minor_audience
  services:
    - action: mobile_app_mafone

- platform: group
  name: action_audience
  services:
    - action: mobile_app_mafone

- platform: group
  name: major_audience
  services:
    - action: mobile_app_mafone

- platform: group
  name: critical_audience
  services:
    - action: mobile_app_mafone

- platform: group
  name: security_audience
  services:
    - action: mobile_app_mafone

# iOS devices only. Used by the badge sync automations to set the app icon
# badge count silently. Android has no equivalent (the delete_alert message
# would be shown as text), so do NOT list Android devices here.
- platform: group
  name: badge_audience
  services:
    - action: mobile_app_mafone