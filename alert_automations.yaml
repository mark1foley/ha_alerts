###############################################################################
# alert_automations.yaml
#
# Paste this file's contents into your automations.yaml file, or include it
# via split configuration. Each automation is correctly formatted as a list
# item for use in automations.yaml.
#
# All automations reference binary_sensor.automated_alert_sensors to identify
# alert binary sensors. Add new alert sensors to this group via the UI.
###############################################################################


###############################################################################
# AUTOMATION 1: Alert Framework - State Change
#
# Triggered by sensor.automated_alert_active_count. Uses queued mode so
# every count change is processed sequentially. Loops through all recently
# changed entities in the appropriate state. Uses status_helper to prevent
# duplicate notifications — only notifies if status is idle.
###############################################################################

- id: alert_framework_state_change
  alias: "Alert Framework: State Change"
  description: >
    Handles initial notification when an alert activates, and clears
    notifications when an alert resolves. Triggered by changes to
    sensor.automated_alert_active_count. Loops through all recently changed
    alert binary sensors in the appropriate state. Checks status_helper to
    prevent duplicate notifications — only notifies if status is idle.
  mode: queued
  max: 10

  trigger:
    - platform: state
      entity_id: sensor.automated_alert_active_count

  condition:
    - condition: state
      entity_id: input_boolean.automated_alert_startup_complete
      state: "on"
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ('unavailable', 'unknown') and
           trigger.from_state.state not in ('unavailable', 'unknown') }}

  action:
    - variables:
        count_increased: >-
          {{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
        member_ids: >-
          {% if trigger.to_state.state | int(0) > trigger.from_state.state | int(0) %}
            {{ expand('binary_sensor.automated_alert_sensors') |
            selectattr('state', 'eq', 'on') | sort(attribute='last_changed',
            reverse=True) | map(attribute='entity_id') | list }}
          {% else %}
            {{ expand('binary_sensor.automated_alert_sensors') |
            selectattr('state', 'eq', 'off') | sort(attribute='last_changed',
            reverse=True) | map(attribute='entity_id') | list }}
          {% endif %}

    - repeat:
        for_each: "{{ member_ids }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ count_increased }}"
            then:
              # ── Alert activates ──────────────────────────────────────────
              - variables:
                  status_helper: "{{ state_attr(repeat.item, 'status_helper') or '' }}"
                  skip_first: "{{ state_attr(repeat.item, 'skip_first') or false }}"
                  severity: "{{ state_attr(repeat.item, 'severity') or 'minor' }}"
                  is_idle: >-
                    {% if status_helper != '' %}
                      {{ is_state(status_helper, 'idle') }}
                    {% else %}
                      true
                    {% endif %}

              # Only notify if status is idle (prevents duplicates)
              - if:
                  - condition: template
                    value_template: "{{ is_idle }}"
                then:
                  # Check suppressor before notifying
                  - variables:
                      is_home: >-
                        {% if states('binary_sensor.automated_alert_home') not in ('unknown', 'unavailable') %}
                          {{ is_state('binary_sensor.automated_alert_home', 'on') }}
                        {% else %}
                          true
                        {% endif %}
                      is_suppressed: >-
                        {{ is_home and
                           is_state('input_boolean.automated_alert_suppressor', 'on') and
                           state_attr(repeat.item, 'is_suppressible') == true }}
                      not_home_severity: "{{ state_attr(repeat.item, 'not_home_severity') or '' }}"
                      effective_severity: >-
                        {% if not is_home and not_home_severity != '' %}
                          {{ not_home_severity }}
                        {% else %}
                          {{ severity }}
                        {% endif %}

                  # If suppressed, set status to suppressed and stop here
                  - if:
                      - condition: template
                        value_template: "{{ is_suppressed and status_helper != '' }}"
                    then:
                      - action: input_select.select_option
                        target:
                          entity_id: "{{ status_helper }}"
                        data:
                          option: suppressed
                    else:
                      # If skip_first is true and effective severity repeats, set to skipped instead of notifying
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_suppressed and skip_first and effective_severity in ['action', 'major', 'critical'] and status_helper != '' }}
                        then:
                          - action: input_select.select_option
                            target:
                              entity_id: "{{ status_helper }}"
                            data:
                              option: skipped
                        else:
                          - if:
                              - condition: template
                                value_template: "{{ not is_suppressed }}"
                            then:
                              - action: script.alert_notify
                                data:
                                  severity: "{{ effective_severity }}"
                                  title: "{{ state_attr(repeat.item, 'title') }}"
                                  message: "{{ state_attr(repeat.item, 'message') }}"
                                  tag: "{{ state_attr(repeat.item, 'tag') }}"
                                  status_helper: "{{ status_helper }}"
                                  image_path: "{{ state_attr(repeat.item, 'image_path') or '' }}"
                                  dashboard_url: "{{ state_attr(repeat.item, 'dashboard_url') or '' }}"

            else:
              # ── Alert resolves ───────────────────────────────────────────
              - variables:
                  status_helper: "{{ state_attr(repeat.item, 'status_helper') or '' }}"

              - action: script.alert_clear
                data:
                  tag: "{{ state_attr(repeat.item, 'tag') }}"
                  acknowledged: false
                  status_helper: "{{ status_helper }}"
                  severity: "{{ state_attr(repeat.item, 'severity') or '' }}"


###############################################################################
# AUTOMATION 2: Alert Framework - Repeat
#
# Fires every 5 minutes. Re-notifies active alerts where status is 'notified'
# (not idle, not acknowledged). Major repeats every 15 min, critical every 5 min.
###############################################################################

- id: alert_framework_repeat
  alias: "Alert Framework: Repeat"
  description: >
    Fires every 5 minutes and on binary_sensor.automated_alert_home state change.
    Covers minor, action, major, security and critical active alerts.
    For minor and security: only notifies when recovering from suppressed state
    or when home state changes (effective severity may change via not_home_severity).
    For action/major/critical: re-notifies on their respective intervals.
    Also handles setting status to suppressed when suppressor is active, and
    notifying when suppression lifts for any severity.
    On home state change, immediately re-evaluates all active alerts so
    not_home_severity upgrades/downgrades take effect without waiting for
    the next 5-minute cycle.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: time_pattern
      minutes: "/5"
      id: time_trigger
    - platform: state
      entity_id: binary_sensor.automated_alert_home
      id: home_changed

  condition:
    - condition: state
      entity_id: input_boolean.automated_alert_startup_complete
      state: "on"

  action:
    - repeat:
        for_each: >
          {{ expand('binary_sensor.automated_alert_sensors')
              | selectattr('state', 'eq', 'on')
              | selectattr('attributes.severity', 'in', ['minor', 'action', 'major', 'security', 'critical'])
              | map(attribute='entity_id')
              | list }}
        sequence:
          # Step 1: if currently not suppressed but status is suppressed, update to suppressed
          # or if currently suppressed but status isn't suppressed yet, set it
          - if:
              - condition: template
                value_template: >
                  {% set status_helper = state_attr(repeat.item, 'status_helper') or '' %}
                  {% set is_home = true if states('binary_sensor.automated_alert_home') in ('unknown', 'unavailable') else is_state('binary_sensor.automated_alert_home', 'on') %}
                  {% set is_suppressed = is_home and is_state('input_boolean.automated_alert_suppressor', 'on') and state_attr(repeat.item, 'is_suppressible') == true %}
                  {{ is_suppressed and status_helper != '' and not is_state(status_helper, 'suppressed') }}
            then:
              - action: input_select.select_option
                target:
                  entity_id: "{{ state_attr(repeat.item, 'status_helper') }}"
                data:
                  option: suppressed

          # Step 2: send notification if conditions are met
          - if:
              - condition: template
                value_template: >
                  {% set status_helper = state_attr(repeat.item, 'status_helper') or '' %}
                  {% set status = states(status_helper) if status_helper != '' else 'idle' %}
                  {% set severity = state_attr(repeat.item, 'severity') %}
                  {% set not_home_severity = state_attr(repeat.item, 'not_home_severity') or '' %}
                  {% set is_home = true if states('binary_sensor.automated_alert_home') in ('unknown', 'unavailable') else is_state('binary_sensor.automated_alert_home', 'on') %}
                  {% set effective_severity = not_home_severity if (not is_home and not_home_severity != '') else severity %}
                  {% set is_suppressed = is_home and is_state('input_boolean.automated_alert_suppressor', 'on') and state_attr(repeat.item, 'is_suppressible') == true %}
                  {{ not is_suppressed and (
                      (status == 'suppressed') or
                      (status in ('notified', 'idle', 'skipped') and (
                          effective_severity == 'critical' or
                          (effective_severity == 'major' and now().minute % 15 == 0) or
                          (effective_severity == 'action' and now().minute == 0) or
                          (trigger.id == 'home_changed' and not_home_severity != '' and status in ('notified', 'idle', 'skipped'))
                      ))
                    ) }}
            then:
              - action: script.alert_notify
                data:
                  severity: >-
                    {% set not_home_severity = state_attr(repeat.item, 'not_home_severity') or '' %}
                    {% set is_home = true if states('binary_sensor.automated_alert_home') in ('unknown', 'unavailable') else is_state('binary_sensor.automated_alert_home', 'on') %}
                    {{ not_home_severity if (not is_home and not_home_severity != '') else state_attr(repeat.item, 'severity') }}
                  title: "{{ state_attr(repeat.item, 'title') }}"
                  message: "{{ state_attr(repeat.item, 'message') }}"
                  tag: "{{ state_attr(repeat.item, 'tag') }}"
                  status_helper: "{{ state_attr(repeat.item, 'status_helper') or '' }}"
                  image_path: "{{ state_attr(repeat.item, 'image_path') or '' }}"
                  dashboard_url: "{{ state_attr(repeat.item, 'dashboard_url') or '' }}"


###############################################################################
# AUTOMATION 3: Alert Framework - Acknowledge
#
# Listens for mobile push notification action button presses matching ACK_<TAG>.
# Sets status_helper to acknowledged, clears mobile tray, stops repeats.
###############################################################################

- id: alert_framework_acknowledge
  alias: "Alert Framework: Acknowledge"
  description: >
    Listens for mobile push notification action button presses matching ACK_<TAG>.
    Sets status_helper to acknowledged, clears mobile tray, stops repeats.
  mode: parallel
  max: 20

  trigger:
    - platform: event
      event_type: mobile_app_notification_action

  condition:
    - condition: template
      value_template: >
        {{ trigger.event.data.action.startswith('ACK_') }}

  action:
    - variables:
        action_tag: >
          {{ trigger.event.data.action | replace('ACK_', '') | lower }}
        matching_sensor: >
          {{ expand('binary_sensor.automated_alert_sensors')
              | selectattr('attributes.tag', 'defined')
              | selectattr('attributes.tag', 'eq', action_tag)
              | list | first | default(none) }}

    - if:
        - condition: template
          value_template: "{{ matching_sensor != none }}"
      then:
        - action: script.alert_clear
          data:
            tag: "{{ action_tag }}"
            acknowledged: true
            severity: >-
              {{ state_attr(
                expand('binary_sensor.automated_alert_sensors')
                | selectattr('attributes.tag', 'defined')
                | selectattr('attributes.tag', 'eq', action_tag)
                | map(attribute='entity_id') | list | first | default(''),
                'severity') or '' }}
            status_helper: >-
              {{ state_attr(
                expand('binary_sensor.automated_alert_sensors')
                | selectattr('attributes.tag', 'defined')
                | selectattr('attributes.tag', 'eq', action_tag)
                | map(attribute='entity_id') | list | first | default(''),
                'status_helper') or '' }}


###############################################################################
# AUTOMATION 4: Alert Framework - Badge Sync
#
# Silently updates the app badge count whenever the active alert count changes
# or on HA startup. Uses sensor.automated_alert_active_count as the badge
# value. Runs in queued mode to handle rapid state changes.
###############################################################################

- id: alert_framework_badge_sync
  alias: "Alert Framework: Badge Sync"
  description: >
    Silently updates the app badge count when the active alert count changes
    and on HA startup. Always sets badge to the current active alert count.
    If count is 0 the badge is cleared. Uses delete_alert message which is
    silent on both iOS and Android.
  mode: queued
  max: 10

  trigger:
    - platform: state
      entity_id: sensor.automated_alert_active_count
      id: alert_state_change
    - platform: homeassistant
      event: start
      id: startup

  action:
    - delay: >
        {% if trigger.id == 'startup' %}00:00:30{% else %}00:00:02{% endif %}
    - service: notify.minor_audience
      data:
        message: delete_alert
        data:
          push:
            badge: "{{ states('sensor.automated_alert_active_count') | int }}"

###############################################################################
# AUTOMATION 5: Alert Framework - Startup
#
# Fires 60 seconds after HA starts. Two purposes:
# 1. Prevents false alert notifications during startup by waiting for all
#    integrations to load before the state change automation begins processing.
# 2. Re-notifies any alerts that were already active before the restart,
#    ensuring no active alerts are silently missed after a restart.
#
# Note: The state change automation should have a condition checking
# input_boolean.automated_alert_startup_complete is 'on' to prevent
# false alerts during the 60 second startup window. Create this helper
# in the UI (Settings > Helpers > Add Helper > Toggle).
###############################################################################

- id: alert_framework_startup
  alias: "Alert Framework: Startup"
  description: >
    Turns off input_boolean.automated_alert_startup_complete immediately on
    restart, closing the processing window. Waits 2 minutes to allow all
    integrations to load, then re-notifies any alerts already active before
    the restart and turns input_boolean.automated_alert_startup_complete back
    on, enabling the state change and repeat automations to begin processing.
  mode: single

  trigger:
    - platform: homeassistant
      event: start

  action:
    # Close the processing window immediately - input_booleans restore their
    # previous state across restarts, so this must run before the delay
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.automated_alert_startup_complete

    - delay: "00:02:00"

    # Re-open the processing window
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.automated_alert_startup_complete

    # Re-notify any alerts already active
    - repeat:
        for_each: >
          {{ expand('binary_sensor.automated_alert_sensors')
              | selectattr('state', 'eq', 'on')
              | map(attribute='entity_id') | list }}
        sequence:
          - variables:
              status_helper: "{{ state_attr(repeat.item, 'status_helper') or '' }}"

          - action: script.alert_notify
            data:
              severity: "{{ state_attr(repeat.item, 'severity') }}"
              title: "{{ state_attr(repeat.item, 'title') }}"
              message: "{{ state_attr(repeat.item, 'message') }}"
              tag: "{{ state_attr(repeat.item, 'tag') }}"
              status_helper: "{{ status_helper }}"
              image_path: "{{ state_attr(repeat.item, 'image_path') or '' }}"
              dashboard_url: "{{ state_attr(repeat.item, 'dashboard_url') or '' }}"


###############################################################################
# AUTOMATION 6: Alert Framework - Periodic Badge Sync
#
# Fires every 10 minutes to resync the app badge count. iOS clears the badge
# count when the app is opened, so this ensures it stays accurate even when
# no alert state changes occur. Uses the same silent delete_alert approach
# as the badge sync automation.
###############################################################################

- id: alert_framework_periodic_badge_sync
  alias: "Alert Framework: Periodic Badge Sync"
  description: >
    Resyncs the app badge count every 10 minutes. iOS clears the badge when
    the app is opened — this ensures it reflects the true active alert count
    even if no alerts have changed state recently.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: time_pattern
      minutes: "/10"

  action:
    - service: notify.minor_audience
      data:
        message: delete_alert
        data:
          push:
            badge: "{{ states('sensor.automated_alert_active_count') | int }}"