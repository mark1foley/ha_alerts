alias: "Alert Framework: Create Status Helpers"
description: Creates all input_select status helpers for the alert framework
mode: single
sequence:
  - repeat:
      for_each:
#        - tag: alert_status_garage_door_open
#          name: Alert Status Garage Door Open
#        - tag: blind_laundry_window_low_battery
#          name: Alert Status Blind Laundry Window Low Battery
#        - tag: blind_living_room_sliding_low_battery
#          name: Alert Status Blind Living Room Sliding Low Battery
#        - tag: blind_main_bedroom_sliding_low_battery
#          name: Alert Status Blind Main Bedroom Sliding Low Battery
#        - tag: blind_spare_bedroom_window_low_battery
#          name: Alert Status Blind Spare Bedroom Window Low Battery
#        - tag: blind_study_window_low_battery
#          name: Alert Status Blind Study Window Low Battery
      sequence:
        - action: input_select.create
          data:
            name: "{{ repeat.item.name }}"
            object_id: "alert_status_{{ repeat.item.tag }}"
            options:
              - idle
              - skipped
              - suppressed
              - notified
              - actioned
              - acknowledged
            icon: mdi:alert